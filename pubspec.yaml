name: money_manager
description: A comprehensive personal finance management application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2
  flutter: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  internet_connection_checker: ^1.0.0

  # State Management & DI
  flutter_bloc: ^8.1.4
  bloc: ^8.1.3
  get_it: ^7.6.4
  injectable: ^2.3.2

  # Navigation
  go_router: ^13.0.1

  # Database
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.2
  path: ^1.9.0

  # Network
  dio: ^5.3.4
  retrofit: ^4.0.3
  json_annotation: ^4.8.1

  # UI & Animations
  flutter_screenutil: ^5.9.0
  rive: ^0.13.1
  lottie: ^2.7.0
  flutter_staggered_animations: ^1.1.1
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1

  # Utilities
  equatable: ^2.0.5
  either_dart: ^1.0.0
  freezed: ^2.4.6
  freezed_annotation: ^2.4.1
  logger: ^2.0.2+1
  uuid: ^4.2.1

  # Financial & Charts
  fl_chart: ^0.65.0

  # Image & Camera
  image_picker: ^1.0.7
  camera: ^0.10.5+5

  # Security
  flutter_secure_storage: ^9.0.0

  # Notifications
  flutter_local_notifications: ^16.3.2

  # Permissions
  permission_handler: ^11.1.0

  # Local Storage
  shared_preferences: ^2.2.2

  # DateTime
  timezone: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

  # Code Generation
  build_runner: ^2.4.7
  retrofit_generator: ^8.0.4
  json_serializable: ^6.7.1
  injectable_generator: ^2.4.1
  drift_dev: ^2.16.0
  custom_lint: ^0.5.7
  very_good_analysis: ^5.1.0

  # Testing
  bloc_test: ^9.1.4
  mockito: ^5.4.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/rive/
    - assets/animations/lottie/
    - assets/fonts/